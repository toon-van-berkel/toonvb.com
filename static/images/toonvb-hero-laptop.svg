    </g>
    <text x="515" y="245"><tspan fill="#c6a1c5">const</tspan><tspan fill="#f2d6ad"> idea</tspan><tspan fill="#d5dfdf"> = {</tspan></text>
    <text x="530" y="275"><tspan fill="#94bbca">curiosity</tspan><tspan fill="#d5dfdf">: </tspan><tspan fill="#dfb18d">true</tspan><tspan fill="#d5dfdf">,</tspan></text>
    <text x="530" y="305"><tspan fill="#94bbca">design</tspan><tspan fill="#d5dfdf">: </tspan><tspan fill="#e5c69e">'intentional'</tspan><tspan fill="#d5dfdf">,</tspan></text>
    <text x="530" y="335"><tspan fill="#94bbca">code</tspan><tspan fill="#d5dfdf">: </tspan><tspan fill="#e5c69e">'functional'</tspan><tspan fill="#d5dfdf">,</tspan></text>
    <text x="515" y="365" fill="#d5dfdf">};</text>
    <text x="515" y="417"><tspan fill="#c6a1c5">build</tspan><tspan fill="#d5dfdf">(</tspan><tspan fill="#f2d6ad">idea</tspan><tspan fill="#d5dfdf">);</tspan></text>
  </g>
  <path d="M 468 457 L 901 439" stroke="#b7d0d2" opacity=".2" />
  <g font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#abc3c9" opacity=".70" transform="rotate(-2.35 485 471)">
    <text x="485" y="477">●   All systems working</text>
  </g>
</g>
