<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">A laptop creating ideas, in a minimalist geometric illustration</title>
<desc id="svgdesc">A large illustrated laptop with a colorful code editor, set against a soft sage-to-peach arch with a golden sun and fine orbit lines.</desc>
<defs>
  <linearGradient id="sky" x1="0%" y1="10%" x2="100%" y2="80%">
    <stop offset="0%" stop-color="#cdd5c8" />
    <stop offset="44%" stop-color="#d9d3ba" />
    <stop offset="100%" stop-color="#efae82" />
  </linearGradient>
  <linearGradient id="sun" x1="25%" y1="0%" x2="85%" y2="100%">
    <stop offset="0%" stop-color="#fff1ca" />
    <stop offset="100%" stop-color="#ffdaa0" />
  </linearGradient>
  <linearGradient id="screenFrame" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#345366" />
    <stop offset="100%" stop-color="#172e3d" />
  </linearGradient>
  <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1c3544" />
    <stop offset="100%" stop-color="#0e2330" />
  </linearGradient>
  <linearGradient id="metalTop" x1="0%" y1="0%" x2="20%" y2="100%">
    <stop offset="0%" stop-color="#6c8793" />
    <stop offset="50%" stop-color="#496573" />
    <stop offset="100%" stop-color="#2e4b5a" />
  </linearGradient>
  <linearGradient id="frontEdge" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#506e7b" />
    <stop offset="100%" stop-color="#284454" />
  </linearGradient>
  <clipPath id="archClip">
    <path d="M 70 629 L 70 310 C 70 165 185 64 333 64 L 865 64 C 1007 64 1130 173 1130 319 L 1130 629 Z" />
  </clipPath>
  <clipPath id="screenClip">
    <path d="M 348 174 Q 348 169 354 169 L 912 146 Q 918 146 919 153 L 938 456 Q 939 465 931 465 L 345 489 Q 339 489 339 482 Z" />
  </clipPath>
  <filter id="laptopShadow" x="-20%" y="-50%" width="140%" height="220%">
    <feGaussianBlur stdDeviation="14" />
  </filter>
</defs>
<rect width="1200" height="680" fill="#f7f6f2" />
<!-- The warm archival-print landscape is deliberately reduced to a background motif. -->
<g clip-path="url(#archClip)">
  <rect x="70" y="64" width="1060" height="565" fill="url(#sky)" />
